<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
  <meta name="description" content="SafeVoice Scanner - Accessible, voice-guided suspicious link and QR code checker for visually impaired users." />
  <meta name="theme-color" content="#6366f1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>SafeVoice Scanner - Secure Link & QR Code Checker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <!-- Phosphor Icons -->
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <!-- html5-qrcode Library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Header -->
  <header class="app-header" role="banner">
    <div class="header-inner">
      <div class="logo-group">
        <div class="logo-icon"><i class="ph-bold ph-shield-check"></i></div>
        <div class="logo-text"><span>SafeVoice</span> Scanner</div>
      </div>
      <div class="header-controls">
        <button id="lang-toggle" class="toggle-btn lang-btn" aria-label="Toggle language" title="Toggle Language">AR</button>
        <button id="theme-toggle" class="toggle-btn" aria-label="Toggle dark mode" title="Toggle Theme">
          <i class="ph-bold ph-moon" id="theme-icon"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main id="main-content" class="app-main" role="main">

    <!-- Hero -->
    <section class="hero-section" aria-label="Welcome">
      <div class="hero-icon-wrap">
        <i class="ph-fill ph-shield-check"></i>
      </div>
      <h1 class="hero-title" data-i18n="heroTitle">SafeVoice <span class="gradient-text">Scanner</span></h1>
      <p class="hero-subtitle" data-i18n="heroSubtitle">Secure link & QR code checker for everyone</p>
    </section>

    <!-- URL Input (Always Visible) -->
    <section class="scan-section" aria-label="URL checker">
      <div class="scan-card">
        <div class="scan-input-row">
          <div class="input-wrapper">
            <i class="ph-bold ph-link input-icon"></i>
            <input type="url" id="url-input" class="url-input" data-i18n="urlPlaceholder" placeholder="Paste or type a URL here..." aria-label="Enter URL to check" autocomplete="off" autocapitalize="off" spellcheck="false" />
          </div>
          <button id="scan-btn" class="scan-btn" aria-label="Check URL">
            <i class="ph-bold ph-magnifying-glass"></i>
            <span data-i18n="scanButton">Scan</span>
          </button>
          <button id="qr-toggle-btn" class="qr-btn" aria-label="Scan QR Code" title="Scan QR Code">
            <i class="ph-bold ph-qr-code"></i>
          </button>
        </div>
      </div>
    </section>

    <!-- QR Scanner (Hidden by default) -->
    <section id="qr-panel" class="qr-panel" aria-label="QR code scanner">
      <div class="qr-card">
        <div class="qr-card-header">
          <div class="qr-title"><i class="ph-bold ph-camera"></i> <span data-i18n="scanQrLabel">Scan QR Code</span></div>
          <button id="close-qr-btn" class="close-qr-btn" aria-label="Close QR scanner"><i class="ph-bold ph-x"></i></button>
        </div>
        <div class="qr-scanner-area"><div id="qr-reader"></div></div>
      </div>
    </section>

    <!-- History -->
    <section class="history-section" aria-label="Scan history">
      <div class="section-header">
        <h2 class="section-title"><i class="ph-bold ph-clock-counter-clockwise"></i> <span data-i18n="historyTitle">Scan History</span></h2>
        <button id="clear-history-btn" class="clear-btn" aria-label="Clear scan history">
          <i class="ph-bold ph-trash"></i> <span data-i18n="clearHistory">Clear</span>
        </button>
      </div>
      <div id="history-list" class="history-list" role="list"></div>
    </section>
  </main>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="loading-overlay" role="alert" aria-live="assertive">
    <div class="loader"></div>
    <div class="loading-text" data-i18n="loadingText">Analyzing link...</div>
  </div>

  <!-- Result Overlay -->
  <div id="result-overlay" class="result-overlay" role="alert" aria-live="assertive">
    <div class="result-content">
      <div id="result-icon-wrap" class="result-icon-wrap">
        <i id="result-icon" class="ph-bold ph-check-circle"></i>
      </div>
      <div id="result-title" class="result-title">Safe</div>
      <div id="result-url" class="result-url"></div>
      <div id="result-details" class="result-details"></div>
      <div class="result-progress"><div id="result-progress-bar" class="result-progress-bar"></div></div>
      <div id="result-dismiss-text" class="result-dismiss" data-i18n="resultDismiss">Tap anywhere to dismiss</div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
